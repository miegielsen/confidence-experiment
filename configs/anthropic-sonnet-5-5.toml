# Matched development comparison with configs/anthropic-batch-v2.toml.
# Sonnet 5.5 rejects thinking=disabled. between_tools disables up-front
# thinking and produces text-only responses for this protocol without tools.
seed = 42
data_dir = "data/banking77"
run_dir = "runs/anthropic-sonnet-5-5"
methods = ["tfidf", "llm"]
max_error = 0.01
threshold_rule = "wilson"

[supervised]
C = 10.0
max_iter = 1000

[llm]
transport = "batch"
enabled = true
model = "claude-sonnet-5-5"
verifier_model = "claude-sonnet-5-5"
cache_dir = "data/anthropic_sonnet_cache"
ledger_path = "data/anthropic_sonnet_cache/spending.json"
enforce_budget = false
budget_usd = 25.0
max_new_calls = 22000
max_output_tokens = 256
thinking = "between_tools"
batch_size = 2000
poll_seconds = 30
# Standard rates verified against Anthropic pricing on 2026-10-09.
# The batch adapter applies the 50% discount itself.
input_usd_per_million = 2.0
cached_input_usd_per_million = 0.10
output_usd_per_million = 10.0
